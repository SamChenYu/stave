<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80">
  <!-- Five staff lines, 10 units apart: thin horizontal edges that land between pixels. -->
  <g fill="#000">
    <rect x="10" y="20" width="180" height="1"/>
    <rect x="10" y="30" width="180" height="1"/>
    <rect x="10" y="40" width="180" height="1"/>
    <rect x="10" y="50" width="180" height="1"/>
    <rect x="10" y="60" width="180" height="1"/>
  </g>
  <!-- Two quarter notes: tilted oval noteheads (curved edges) with stems. -->
  <ellipse cx="70" cy="45.5" rx="6" ry="4.2" transform="rotate(-20 70 45.5)"/>
  <rect x="75.2" y="17" width="1.2" height="28"/>
  <ellipse cx="130" cy="35.5" rx="6" ry="4.2" transform="rotate(-20 130 35.5)"/>
  <rect x="135.2" y="7" width="1.2" height="28"/>
  <!-- A slur between them: a stroked curve rather than a filled shape. -->
  <path d="M 70 54 C 85 66, 115 62, 130 46" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round"/>
</svg>
